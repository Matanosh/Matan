<script>
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeIO = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = (x) => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const span = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const env = (t, a, b, d = 0.35) => Math.min(ease(span(t, a, a + d)), 1 - ease(span(t, b - d, b)));
const rise = (t, a, d = 0.45) => (1 - ease(span(t, a, a + d)));
const show = (el, t, a, b, dy = 50, blur = true) => {
  if (typeof el === 'string') el = $(el);
  const o = env(t, a, b), k = rise(t, a), out = ease(span(t, b - 0.35, b));
  el.style.opacity = o.toFixed(3);
  el.style.transform = `translateY(${(k * dy - out * 30).toFixed(1)}px) scale(${(1 + k * 0.06).toFixed(3)})`;
  el.style.filter = blur && o < 0.999 ? `blur(${((k + out) * 14).toFixed(1)}px)` : '';
};

const M = window.MEDIA || {}; // frame counts of the generated clips, written by render.js
const FPS = 30;

/* ---------- shots (film clock, seconds) ----------

const PRES = 'src/presenter-916.jpg';
const SHOTS = [

];

const TEL = TEXTS.map(([html, cls, top]) => { const d = document.createElement('div'); d.className = 'layer ' + cls; d.style.top = top + 'px'; d.innerHTML = html; host.appendChild(d); return d; });

  const d = document.createElement('div'); d.className = 'shot';
  const img = document.createElement('img'); d.appendChild(img); shotsEl.appendChild(d);
  s.el = d; s.img = img; s.hasSeq = !!(s.seq && M[s.seq]); img.src = s.still;
  if (s.hasSeq) s.cam = s.seq === 'presenter' ? s.cam : [[1, 0, 0], [1.04, 0, 0]];
}
function place(s, k, extra) {
  const img = s.img, W = img.naturalWidth || 1080, H = img.naturalHeight || 1920;
  const base = Math.max(1080 / W, 1920 / H);
  const [s0, x0, y0] = s.cam[0], [s1, x1, y1] = s.cam[1], e = easeIO(k) * 0.35 + k * 0.65;

  img.style.width = W + 'px'; img.style.height = H + 'px';
  img.style.transform = `translate(-50%, -50%) translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${sc.toFixed(4)})`;
}

let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const g = $('grain').getContext('2d'), gi = g.createImageData(540, 960);
function grain(f) { seed = 11 + (f % 24) * 977; for (let i = 0; i < gi.data.length; i += 4) { const v = rnd() * 255; gi.data[i] = gi.data[i + 1] = gi.data[i + 2] = v; gi.data[i + 3] = 255; } g.putImageData(gi, 0, 0); }

// captions from the voiceover word timings, in short lines
const WORDS = window.WORDS || [];
const LINES = [];
{ let cur = []; for (const w of WORDS) { cur.push(w); if (/[.,]$/.test(w.text) || cur.length >= 4) { LINES.push(cur); cur = []; } } if (cur.length) LINES.push(cur); }
const cap = $('cap');
function captions(t) {
  const i = LINES.findIndex((l, j) => t >= l[0].start - 0.08 && t < (LINES[j + 1] ? Math.min(LINES[j + 1][0].start - 0.08, l[l.length - 1].end + 0.6) : l[l.length - 1].end + 0.6));
  if (i < 0 || t > 144.3) { cap.innerHTML = ''; return; }
  const line = LINES[i];
  cap.innerHTML = line.map((w) => `<span class="${t >= w.start - 0.03 ? 'on' : ''}">${w.text.replace(/[.,]$/, '')}</span>`).join('');
  const k = ease(span(t, line[0].start - 0.08, line[0].start + 0.16));
  cap.style.opacity = k.toFixed(3); cap.style.transform = `translateY(${((1 - k) * 18).toFixed(1)}px)`;
}

const leak = $('leak');
window.TOTAL = 153;
window.render = (t) => {
  const f = Math.round(t * FPS);

    if (!(t >= s.a && t < s.b)) { s.el.style.opacity = 0; return; }
    const k = span(t, s.a, s.b), xin = XF[s.id], tin = span(t, s.a, s.a + 0.45);
    const extra = {}; let op = 1, blur = 0;
    if (xin && tin < 1) {
      op = ease(tin);
      if (xin === 'zoom') { extra.scale = 1 + (1 - ease(tin)) * 0.25; blur = (1 - ease(tin)) * 18; }
      if (xin === 'whip') { extra.x = (1 - easeIO(tin)) * -520; blur = (1 - ease(tin)) * 26; }
    } else if (!xin && n > 0) op = 1;
    const next = SHOTS[n + 1];
    if (next && t > next.a && XF[next.id]) { const to = span(t, next.a, s.b); extra.scale = (extra.scale || 1) * (1 + ease(to) * 0.18); blur = Math.max(blur, ease(to) * 14); }
    if (s.hasSeq) {
      const idx = clamp(Math.floor(s.at(t) * FPS), 0, M[s.seq] - 1);
      const src = `frames/${s.seq}/${String(idx + 1).padStart(4, '0')}.jpg`;
      if (s.img.getAttribute('src') !== src) s.img.src = src;
    }
    place(s, k, extra);
    s.el.style.opacity = op.toFixed(3);
    s.el.style.filter = blur > 0.2 ? `blur(${blur.toFixed(1)}px)` : '';
    s.el.style.zIndex = n;
  });
  let lk = 0, fl = 0;
  for (const c of CUTS) { const d = t - c; if (d > -0.25 && d < 0.6) lk = Math.max(lk, Math.sin(clamp((d + 0.25) / 0.85) * Math.PI)); if (d > -0.05 && d < 0.25) fl = Math.max(fl, 1 - d / 0.25); }
  leak.style.background = `radial-gradient(60% 45% at ${(30 + 40 * Math.sin(t * 0.7)).toFixed(1)}% ${(35 + 20 * Math.cos(t * 0.5)).toFixed(1)}%, rgba(255,90,90,${(0.55 * lk).toFixed(3)}), transparent 70%), radial-gradient(55% 40% at 80% 70%, rgba(27,145,223,${(0.5 * lk).toFixed(3)}), transparent 70%)`;
  $('flash').style.opacity = (0.35 * fl).toFixed(3);

  // intro: fade up from black, logo resolves out of blur, subtitle follows
  $('shots').style.opacity = ease(span(t, 0, 1.2)).toFixed(3);
  const il = $('intro'), io = env(t, 0.8, 5.9, 0.6); il.style.opacity = io.toFixed(3);
  il.style.transform = `scale(${(0.9 + 0.1 * ease(span(t, 0.8, 2.6)) + 0.03 * span(t, 2.6, 5.9)).toFixed(3)})`;
  il.style.filter = `blur(${(rise(t, 0.8, 1.2) * 24).toFixed(1)}px)`;
  il.style.letterSpacing = '0';
  show('introsub', t, 2.4, 5.8, 40);

  $('lt').style.opacity = env(t, 7.0, 11.9).toFixed(3);
  $('lt').style.transform = `translateX(${(rise(t, 7.0, 0.6) * 60).toFixed(1)}px)`;
  $('ltbar').style.transform = `scaleX(${ease(span(t, 7.0, 7.7)).toFixed(3)})`;

  TEXTS.forEach(([, cls, , a, b], i) => show(TEL[i], t, a, b, cls === 'h1' ? 70 : 50));

  // 120 m to the light rail (25.4-36.7)
  const dist = $('dist'); dist.style.opacity = env(t, 25.4, 36.7, 0.4).toFixed(3); dist.style.transform = `translateY(${(rise(t, 25.4, 0.5) * 60).toFixed(1)}px)`;
  const draw = easeIO(span(t, 27.5, 29.4));
  $('dsolid').style.strokeDasharray = `${draw} 1`; $('dline').style.opacity = (1 - draw).toFixed(3);
  $('dnum').textContent = Math.round(120 * ease(span(t, 27.5, 28.9)));
  $('dnum').style.opacity = ease(span(t, 27.4, 27.7)).toFixed(3); $('dunit').style.opacity = ease(span(t, 28.5, 28.9)).toFixed(3);
  $('pinA').setAttribute('transform', `translate(820 380) scale(${back(span(t, 25.5, 26.0)).toFixed(3)})`);
  $('pinB').setAttribute('transform', `translate(260 380) scale(${back(span(t, 29.4, 29.9)).toFixed(3)})`);
  const rp = (t * 0.9) % 1; $('ringA').setAttribute('r', (62 + rp * 50).toFixed(1)); $('ringA').style.opacity = (1 - rp).toFixed(3);
  $('dA').style.opacity = ease(span(t, 25.7, 26.1)).toFixed(3);
  $('dB').style.opacity = $('dB2').style.opacity = ease(span(t, 29.5, 29.9)).toFixed(3);

  // 2 towers, 25 floors (38.4-42.8)

    $(id).style.transform = `translateY(${(rise(t, a, 0.5) * 80).toFixed(1)}px) scale(${(0.9 + 0.1 * back(span(t, a, a + 0.5))).toFixed(3)})`;
    $(nid).textContent = Math.round(n * ease(span(t, a, a + 0.9)));
  }
  show('four', t, 76.3, 78.8, 80);

  for (const [id, a] of [['r3', 91.4], ['r4', 92.1], ['r5', 92.5]]) { const k = back(span(t, a, a + 0.45)); $(id).style.opacity = ease(span(t, a, a + 0.2)).toFixed(3); $(id).style.transform = `scale(${k.toFixed(3)}) rotate(${((1 - ease(span(t, a, a + 0.45))) * -12).toFixed(1)}deg)`; }
  $('roomsl').style.opacity = ease(span(t, 93.4, 93.8)).toFixed(3);

  v2.style.letterSpacing = `${(rise(t, 128.6, 1.2) * 0.25).toFixed(3)}em`;
  v2.style.filter = `blur(${(rise(t, 128.6, 0.8) * 20).toFixed(1)}px)`;

  lg.style.transform = `scale(${(0.86 + 0.14 * back(span(t, 144.8, 145.7))).toFixed(3)})`;
  lg.style.filter = `blur(${(rise(t, 144.8, 0.7) * 16).toFixed(1)}px)`;
  for (const [id, a] of [['endline', 145.7], ['endaddr', 146.0], ['endcta', 146.4], ['endfine', 146.8]]) {
    const el = $(id); el.style.opacity = ease(span(t, a, a + 0.5)).toFixed(3);
    el.style.transform = (id === 'endcta' ? 'translateX(-50%) ' : '') + `translateY(${(rise(t, a, 0.5) * 40).toFixed(1)}px)` + (id === 'endcta' ? ` scale(${(1 + 0.03 * Math.sin(Math.max(0, t - 147) * 5)).toFixed(3)})` : '');
  }
  const wv = (ph, amp, base) => { let d = `M0 ${base}`; for (let x = 0; x <= 1080; x += 30) d += ` L${x} ${(base + Math.sin(x / 140 + t * 1.4 + ph) * amp).toFixed(1)}`; return d + ' L1080 520 L0 520 Z'; };
  $('wpath').setAttribute('d', wv(0, 22, 300)); $('wpath2').setAttribute('d', wv(2, 18, 380));
