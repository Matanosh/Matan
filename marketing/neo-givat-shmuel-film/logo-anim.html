<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Urban renewal company logo reveal</title>
<style>
  /* 7-second logo reveal for "החברה להתחדשות עירונית", rendered frame by frame by render-tour.js. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { position: relative; background: radial-gradient(70% 70% at 50% 45%, #ffffff 0%, #f3f6fa 70%, #e9eef5 100%); }
  #grid { position: absolute; inset: 0; opacity: 0;
    background-image: linear-gradient(rgba(30, 64, 160, 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(30, 64, 160, 0.06) 1px, transparent 1px);
    background-size: 80px 80px; mask-image: radial-gradient(60% 60% at 50% 50%, #000 0%, transparent 100%); }
  #logo { position: absolute; left: 50%; top: 50%; width: 730px; height: 300px; margin: -150px 0 0 -365px; transform-origin: 50% 50%; }
  #logo img { position: absolute; inset: 0; width: 730px; height: 300px; will-change: clip-path, transform, opacity; }
  #shine { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
    background: linear-gradient(100deg, transparent 38%, rgba(255,255,255,0.95) 50%, transparent 62%); background-size: 300% 100%; }
  #floor { position: absolute; left: 50%; top: 50%; width: 900px; height: 2px; margin: 290px 0 0 -450px; background: linear-gradient(90deg, transparent, rgba(30,64,160,0.35), transparent); transform-origin: 50% 50%; }
  #white { position: absolute; inset: 0; background: #fff; }
</style>
</head>
<body>
<div id="grid"></div>
<div id="floor"></div>
<div id="logo">
  <img id="blue" src="img/logo-anim/bar-blue.png" alt="">
  <img id="cyan" src="img/logo-anim/bar-cyan.png" alt="">
  <img id="orange" src="img/logo-anim/bar-orange.png" alt="">
  <img id="t1" src="img/logo-anim/text-1.png" alt="">
  <img id="t2" src="img/logo-anim/text-2.png" alt="החברה להתחדשות עירונית">
  <div id="shine"></div>
</div>
<div id="white"></div>
<script>
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const span = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 4);
const easeIO = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = (x) => { x = clamp(x); const c = 1.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// a bar grows up from its base like a tower going up
const rise = (el, t, a, d) => {
  const p = span(t, a, a + d);
  el.style.clipPath = `inset(${(100 - 100 * easeOut(p)).toFixed(2)}% 0 0 0)`;
  el.style.transform = `translateY(${(14 * (1 - back(p))).toFixed(2)}px)`;
  el.style.opacity = p > 0 ? 1 : 0;
};
// text wipes in right to left, the way Hebrew reads
const wipe = (el, t, a, d) => {
  const p = easeIO(span(t, a, a + d));
  el.style.clipPath = `inset(0 0 0 ${(100 - 100 * p).toFixed(2)}%)`;
  el.style.transform = `translateX(${(-24 * (1 - p)).toFixed(2)}px)`;
  el.style.opacity = p > 0 ? 1 : 0;
};
window.TOTAL = 7;
window.render = (t) => {
  $('white').style.opacity = (1 - span(t, 0, 0.5) + span(t, 6.4, 7)).toFixed(3);
  $('grid').style.opacity = (0.9 * easeIO(span(t, 0.2, 1.6))).toFixed(3);
  $('floor').style.transform = `scaleX(${easeOut(span(t, 0.2, 1.0)).toFixed(3)})`;
  rise($('orange'), t, 0.45, 0.9);
  rise($('cyan'), t, 0.8, 0.9);
  rise($('blue'), t, 1.15, 0.9);
  wipe($('t1'), t, 1.9, 0.9);
  wipe($('t2'), t, 2.25, 1.1);
  // slow push-in through the whole piece
  const s = 2.05 + 0.12 * easeIO(span(t, 0, 7));
  $('logo').style.transform = `scale(${s.toFixed(4)})`;
  $('shine').style.backgroundPosition = `${(100 - 100 * easeIO(span(t, 3.7, 4.9))).toFixed(1)}% 0`;
  $('shine').style.opacity = span(t, 3.6, 3.7) * (1 - span(t, 4.9, 5.0));
};
window.render(0);
</script>
</body>
</html>
