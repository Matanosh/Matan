<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>חנוכה – MS Group</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root {
    --night: #0a1836; --harbor: #0c1d40; --dusk: #15284b;
    --ivory: #fbf8f1; --mist: #ddd6c6;
    --gold: #d2a249; --pale-gold: #e9cb8c; --antique: #a47b30;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: var(--night); }
  .card {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background:
      radial-gradient(ellipse 70% 45% at 50% 40%, rgba(210,162,73,.16), transparent 70%),
      radial-gradient(ellipse 120% 80% at 50% 0%, var(--dusk), var(--harbor) 55%, var(--night));
    display: flex; flex-direction: column; align-items: center;
    font-family: Heebo, system-ui, sans-serif; color: var(--ivory);
  }
  .frame { position: absolute; inset: 40px; border: 1px solid rgba(210,162,73,.35); }
  .frame::after { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(210,162,73,.14); }
  .logo { margin-top: 110px; width: 230px; }
  .menorah { margin-top: 70px; width: 620px; }
  h1 {
    margin-top: 40px;
    font-family: "Frank Ruhl Libre", Georgia, serif; font-weight: 300;
    font-size: 118px; line-height: 1; letter-spacing: -.01em; color: var(--ivory);
  }
  h1 span { color: var(--gold); }
  .rule { margin-top: 44px; width: 90px; height: 1px; background: var(--gold); }
  p.wish {
    margin-top: 40px; text-align: center; font-weight: 300;
    font-size: 38px; line-height: 1.55; color: var(--mist);
  }
  .sign {
    position: absolute; bottom: 104px; left: 0; right: 0; text-align: center;
    font-size: 28px; letter-spacing: .02em; color: var(--pale-gold);
  }
  .sign b { font-weight: 500; color: var(--ivory); }
  .sign .dot { margin: 0 14px; color: var(--antique); }
</style>
</head>
<body>
<div class="card">
  <div class="frame"></div>
  <img class="logo" src="msgroup-logo.png" alt="MS Group">

  <svg class="menorah" viewBox="0 0 620 440" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e9cb8c"/><stop offset=".5" stop-color="#d2a249"/><stop offset="1" stop-color="#a47b30"/>
      </linearGradient>
      <radialGradient id="flame" cx=".5" cy=".7" r=".6">
        <stop offset="0" stop-color="#fffaf0"/><stop offset=".45" stop-color="#ffd98a"/><stop offset="1" stop-color="#e39b2e"/>
      </radialGradient>
      <radialGradient id="glow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="rgba(255,214,140,.55)"/><stop offset="1" stop-color="rgba(255,214,140,0)"/>
      </radialGradient>
      <g id="light">
        <circle r="30" fill="url(#glow)"/>
        <path d="M0,-20 C9,-8 9,4 0,10 C-9,4 -9,-8 0,-20 Z" fill="url(#flame)"/>
      </g>
    </defs>
    <!-- arms: lower half-circles centred on the stem -->
    <g fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round">
      <path d="M70,170 A240,240 0 0,0 550,170"/>
      <path d="M130,170 A180,180 0 0,0 490,170"/>
      <path d="M190,170 A120,120 0 0,0 430,170"/>
      <path d="M250,170 A60,60 0 0,0 370,170"/>
      <line x1="310" y1="140" x2="310" y2="404"/>
    </g>
    <!-- cups -->
    <g fill="url(#g)">
      <rect x="56"  y="158" width="28" height="12" rx="3"/>
      <rect x="116" y="158" width="28" height="12" rx="3"/>
      <rect x="176" y="158" width="28" height="12" rx="3"/>
      <rect x="236" y="158" width="28" height="12" rx="3"/>
      <rect x="356" y="158" width="28" height="12" rx="3"/>
      <rect x="416" y="158" width="28" height="12" rx="3"/>
      <rect x="476" y="158" width="28" height="12" rx="3"/>
      <rect x="536" y="158" width="28" height="12" rx="3"/>
      <rect x="294" y="126" width="32" height="14" rx="3"/>
      <path d="M268,404 L352,404 L374,424 L246,424 Z"/>
    </g>
    <!-- candles -->
    <g fill="#fbf8f1" opacity=".92">
      <rect x="63"  y="112" width="14" height="46" rx="2"/>
      <rect x="123" y="112" width="14" height="46" rx="2"/>
      <rect x="183" y="112" width="14" height="46" rx="2"/>
      <rect x="243" y="112" width="14" height="46" rx="2"/>
      <rect x="363" y="112" width="14" height="46" rx="2"/>
      <rect x="423" y="112" width="14" height="46" rx="2"/>
      <rect x="483" y="112" width="14" height="46" rx="2"/>
      <rect x="543" y="112" width="14" height="46" rx="2"/>
      <rect x="302" y="78"  width="16" height="48" rx="2"/>
    </g>
    <!-- flames -->
    <use href="#light" x="70"  y="94"/>
    <use href="#light" x="130" y="94"/>
    <use href="#light" x="190" y="94"/>
    <use href="#light" x="250" y="94"/>
    <use href="#light" x="370" y="94"/>
    <use href="#light" x="430" y="94"/>
    <use href="#light" x="490" y="94"/>
    <use href="#light" x="550" y="94"/>
    <use href="#light" x="310" y="60"/>
  </svg>

  <h1>חג חנוכה <span>שמח</span></h1>
  <div class="rule"></div>
  <p class="wish">שהאור של החג ימלא את הבית,<br>ושהבית הבא יהיה בדיוק מה שחלמתם עליו.</p>

  <div class="sign"><b>מתן</b><span class="dot">|</span><bdi>M.S. Group</bdi><span class="dot">|</span><bdi>msgp.co.il</bdi></div>
</div>
</body>
</html>
