# Render settings for the live site (static, no server code).
# The build copies only the public pages and assets into ./public.
services:
  - type: web
    runtime: static
    name: ms-group-global
    branch: ccr-c38204d4-t5wcpg
    autoDeployTrigger: commit
    buildCommand: rm -rf public && mkdir -p public && cp -r index.html privacy.html terms.html accessibility.html en fr assets public/
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    domains:
      - global.msgp.co.il
